<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatroom</title>
    <style>
        #chat {
            border: 1px solid #ccc;
            padding: 10px;
            width: 700px;
            height: 700px;
            overflow-y: scroll;
            float: left;
        }
        #user-list {
            border: 1px solid #ccc;
            padding: 10px;
            width: 200px;
            height: 700px;
            overflow-y: scroll;
            float: right;
        }
    </style>
</head>
<body>
    <div id="chat"></div>
    <div id="user-list"></div>
    <script src="https://cdn.socket.io/4.0.0/socket.io.min.js"></script>
    <script src="/chatroomjs"></script>
</body>
</html>
